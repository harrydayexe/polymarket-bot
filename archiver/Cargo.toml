[package]
name = "archiver"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.6"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
