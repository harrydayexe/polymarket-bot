archive_dir = "./archive"                                              # Root of everything in section 8.3
category_tags = ["politics", "geopolitics"]                            # Gamma tag names to include
min_liquidity_usd = 2000000                                            # Joining threshold only (section 6)
registry_interval = "5m"
closed_grace_period = "6h"                                             # Keep recording after close
tokens_per_connection = 250
heartbeat_interval = "10s"
heartbeat_timeout = "30s"
connect_timeout = "10s"
backoff_initial = "1s"
backoff_max = "60s"
backoff_reset_after = "5m"
snapshot_interval = "60m"
snapshot_batch_size = 500                                              # Maximum the endpoint accepts
snapshot_max_requests_per_s = 2
write_queue_capacity = 100000                                          # records
flush_interval = "1s"
sync_interval = "5s"
raw_retention = "90d"                                                  # After successful compaction
min_free_disk_gb = 10                                                  # Below this, `status` reports unhealthy
websocket_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
clob_rest_url = "https://clob.polymarket.com"
gamma_url = "https://gamma-api.polymarket.com"
log_level = "info"
