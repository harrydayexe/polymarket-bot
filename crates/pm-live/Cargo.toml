[package]
name = "pm-live"
version = "0.1.0"
edition = "2024"
description = "Live paper-trading system: ingest, engine and (later) detectors, strategies and the paper broker"

[[bin]]
name = "pmlive"
path = "src/main.rs"

[dependencies]
pm-core = { path = "../pm-core" }
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
humantime-serde = "1.1.1"
marcasite = { workspace = true }
marcasite-core = { workspace = true }
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
zstd = "0.14.3"

[dev-dependencies]
pm-core = { path = "../pm-core", features = ["test-util"] }
rust_decimal_macros = "1.40.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
wiremock = "0.6.3"
