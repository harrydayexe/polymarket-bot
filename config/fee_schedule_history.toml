# Taker fee coefficients by category over time (§3.7 of the Phase 1 spec).
#
# One row per (category, effective_from). The row with the latest effective_from <= t applies.
# A category with no row at or before t had no fees then (rate 0). Shared by the Rust fallback
# (pm-core `fees`) and the Python research code (P2/P3).
#
# Formula: fee = shares × rate × (p × (1 − p))^exponent. Every live market has sent exponent 1.
#
# `verified = false` marks a row whose date or rate the docs do not pin down; P2/P3 report
# results with and without those rows. Categories are Polymarket's fee categories; politics is
# split into `politics_elections` and `politics_other` from the 20 Nov 2026 change, and both
# rows exist before it (same rate) so a lookup for either works at any time.

# --- Fee Structure V2 (changelog, 30 Mar 2026): fees extended to most categories. The entry
# gives a date but no time, and the docs give no coefficients from before July other than
# sports', so these rows are unverified. Rates are the ones /trading/fees lists before the
# 20 Nov change.

[[fee]]
category = "geopolitics"
effective_from = "2026-03-30T00:00:00Z"
rate = "0"
exponent = 1
source = "https://docs.polymarket.com/trading/fees"
verified = true

